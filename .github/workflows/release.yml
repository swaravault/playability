# Release Workflow
# =================
# Triggered when a new tag is pushed (e.g., v1.0.0).
# Builds all platforms and creates a GitHub Release with artifacts.

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Create Release
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false
          body: |
            ## What's New
            
            <!-- Add release notes here -->
            
            ## Downloads
            
            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon) | `*-arm64.dmg` or `*-arm64.zip` |
            | macOS (Intel) | `*-x64.dmg` or `*-x64.zip` |
            | Windows | `*-Setup.exe` or `*.zip` |
            | Android | `*.apk` |
            | Web | Deploy `web-dist.zip` to your server |

  # ─────────────────────────────────────────────────────────────
  # Build Web
  # ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app-web/package-lock.json

      - name: Install dependencies
        working-directory: app-web
        run: npm ci

      - name: Copy shared assets
        run: cp public/favicon.png public/logo-192.png public/vite.svg app-web/public/ 2>/dev/null || true

      - name: Build
        working-directory: app-web
        run: npm run build

      - name: Create ZIP
        run: cd app-web && zip -r ../web-dist.zip dist/

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./web-dist.zip
          asset_name: web-dist-${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip

  # ─────────────────────────────────────────────────────────────
  # Build macOS
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app-macos/package-lock.json

      - name: Install dependencies
        working-directory: app-macos
        run: npm ci

      - name: Copy shared assets
        run: cp public/favicon.png public/logo-192.png public/vite.svg app-macos/public/ 2>/dev/null || true

      - name: Build and package
        working-directory: app-macos
        run: |
          npm run build
          npx electron-builder --mac zip dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./app-macos/release/*.zip
          asset_name: macos-${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip
        continue-on-error: true

      - name: Upload DMG to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./app-macos/release/*.dmg
          asset_name: macos-${{ needs.create-release.outputs.version }}.dmg
          asset_content_type: application/x-apple-diskimage
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Build Windows
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app-windows/package-lock.json

      - name: Install dependencies
        working-directory: app-windows
        run: npm ci

      - name: Copy shared assets
        run: Copy-Item public/favicon.png, public/logo-192.png, public/vite.svg app-windows/public/ -ErrorAction SilentlyContinue

      - name: Build and package
        working-directory: app-windows
        run: |
          npm run build
          npx electron-builder --win nsis zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./app-windows/release/*Setup*.exe
          asset_name: windows-${{ needs.create-release.outputs.version }}-setup.exe
          asset_content_type: application/x-msdownload
        continue-on-error: true

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./app-windows/release/*.zip
          asset_name: windows-${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # Build Android
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app-android/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app-android
        run: npm ci

      - name: Copy shared assets
        run: cp public/favicon.png public/logo-192.png public/vite.svg app-android/public/ 2>/dev/null || true

      - name: Build web assets
        working-directory: app-android
        run: npm run build

      - name: Add Capacitor platform
        working-directory: app-android
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: app-android
        run: npx cap sync android

      - name: Build APK
        working-directory: app-android/android
        run: ./gradlew :app:assembleDebug

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./app-android/android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: android-${{ needs.create-release.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive
